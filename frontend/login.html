<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your SkillSwap account to manage your skill exchanges.">
  <title>Log In - SkillSwap</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        ⚡ Skill<span>Swap</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="discover.html" class="nav-link">Discover Skills</a></li>
      </ul>

      <div class="nav-actions">
        <a href="register.html" class="btn btn-outline btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to continue exchanging knowledge</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary auth-btn-submit" id="submit-btn">
          Sign In
        </button>
      </form>

      <div class="demo-credentials-box">
        <strong>Quick Demo Credentials:</strong>
        <div class="demo-buttons-row">
          <button type="button" class="btn-demo" onclick="fillDemo('priya.patel@gmail.com', 'Password123!')">Demo User (Priya)</button>
          <button type="button" class="btn-demo" onclick="fillDemo('admin@skillswap.com', 'Password123!')">Demo Admin</button>
        </div>
      </div>

      <div class="auth-footer">
        Don't have an account yet? <a href="register.html">Sign up free</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 SkillSwap. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/validation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.fillDemo = (email, pass) => {
        const emailEl = document.getElementById('email');
        const passEl = document.getElementById('password');
        if (emailEl) {
          emailEl.value = email;
          validator.clearError(emailEl);
        }
        if (passEl) {
          passEl.value = pass;
          validator.clearError(passEl);
        }
      };

      // If already logged in, redirect to dashboard
      if (auth.isAuthenticated()) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Comprehensive inline validation
        const isValid = validator.validateForm(form, {
          '#email': {
            required: 'Please enter your email address.',
            email: 'Please enter a valid email address (e.g. name@example.com).'
          },
          '#password': {
            required: 'Please enter your password.'
          }
        });

        if (!isValid) return;

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        try {
          await auth.login(email, password);
          ui.showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        } catch (err) {
          ui.showToast(err.message, 'error');
          // If backend indicates invalid credentials, highlight password field
          if (err.message && err.message.toLowerCase().includes('password')) {
            validator.showError('#password', err.message);
          } else if (err.message && err.message.toLowerCase().includes('email')) {
            validator.showError('#email', err.message);
          }
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
