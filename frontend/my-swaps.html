<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your incoming and outgoing SkillSwap exchange requests.">
  <title>My Swaps - SkillSwap</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        ⚡ Skill<span>Swap</span>
      </a>

      <button class="menu-toggle-btn" aria-label="Toggle navigation">☰</button>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="discover.html" class="nav-link">Discover Skills</a></li>
        <li><a href="my-swaps.html" class="nav-link active">My Swaps</a></li>
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      </ul>

      <div class="nav-actions"></div>
    </div>
  </header>

  <main style="padding: 2.5rem 0 4rem;">
    <div class="container" style="max-width: 900px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="font-family: var(--font-display); font-size: 1.85rem; font-weight: 700;">Skill Exchanges</h1>
          <p style="color: var(--color-text-muted);">Track your sent proposals and incoming exchange requests</p>
        </div>
        <div>
          <a href="discover.html" class="btn btn-primary">+ Propose Swap</a>
        </div>
      </div>

      <!-- Filter Tabs -->
      <nav class="tab-nav" aria-label="Swap request tabs">
        <button class="tab-btn active" data-filter="all">All Exchanges</button>
        <button class="tab-btn" data-filter="received">Received</button>
        <button class="tab-btn" data-filter="sent">Sent</button>
        <button class="tab-btn" data-filter="pending">Pending</button>
        <button class="tab-btn" data-filter="accepted">Active / Accepted</button>
        <button class="tab-btn" data-filter="completed">Completed</button>
        <button class="tab-btn" data-filter="sessions" style="border-left: 2px solid var(--color-border); margin-left: 0.5rem; font-weight: 700;">📅 Scheduled Sessions <span id="sessions-count-pill" style="display:none; background: var(--color-primary); color: #fff; font-size: 0.7rem; padding: 0.1rem 0.45rem; border-radius: var(--radius-full); margin-left: 0.25rem;"></span></button>
      </nav>

      <!-- Swaps List Container -->
      <div id="swaps-list">
        <div class="spinner"></div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 SkillSwap. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/swaps.js"></script>
</body>
</html>
